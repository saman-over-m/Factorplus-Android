name: Build Factor Plus Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Detect Android project
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Android project found in repository root"
          elif [ -f "android_project/settings.gradle" ]; then
            echo "PROJECT_DIR=android_project" >> "$GITHUB_ENV"
            echo "Android project found in android_project/"
          else
            echo "ERROR: settings.gradle not found"
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR/app/build" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             artifacts/FactorPlus-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FactorPlus-Android-APK
          path: artifacts/FactorPlus-debug.apk
          if-no-files-found: error
          retention-days: 30
