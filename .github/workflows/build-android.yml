name: Build Factor Plus Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android_project
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FactorPlus-Android-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
