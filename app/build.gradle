plugins { id 'com.android.application' }

android {
    namespace 'ir.factorplus.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.factorplus.app'
        minSdk 23
        targetSdk 35

    buildFeatures { buildConfig true }
        versionCode 1
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
